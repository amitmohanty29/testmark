# Netlify Configuration for MarkSure Platform
# Official Legal Metrology OIML R-76 Platform

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) Client-Side Route Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers for production deployment
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"